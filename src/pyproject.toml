[project]
name = "sigmascope"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pip>=26.3",
    "pysigma>=2.0.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
splunk = [
    "pysigma-backend-splunk>=3.0.0",
]
kql = [
    "pysigma-backend-kusto>=0.4.5"
]

[dependency-groups]
dev = [
    "pysigma-backend-splunk>=3.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "-vv"
