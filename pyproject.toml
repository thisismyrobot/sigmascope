[project]
name = "sigmascope"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pip>=26.3",
    "pysigma>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
splunk = [
    "pysigma-backend-splunk>=2.1.0"
]
kql = [
    "pysigma-backend-kusto>=1.0.0"
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
addopts = "-vv -x -n 2"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^tests/",
]
