name: CI
on: [push]
jobs:
  check_code:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
      - name: Check types
        run: |
          uv run mypy .
          uv run black --check .
          uv run ruff check
  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync --all-extras
      - name: Test with pytest
        run: |
          uv run py.test -n 2
