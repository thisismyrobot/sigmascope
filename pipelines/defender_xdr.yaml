name: defender_xdr_field_mapping
priority: 1
# Maps firewall log concepts of src and destination addresses to constructs used
# in sysmon and OS logs that include LocalIP and RemoteIP. This allows for
# Defender XDR searches based on the same inputs.
allowed_backends:
  - kusto
transformations:
  - id: redirect_logsource
    type: change_logsource
    # network_connection maps to correct event table in the kusto microsoft_xdr pipeline.
    category: network_connection
    rule_conditions:
      - type: logsource
        category: firewall
  - id: defender_xdr_device_network_events_field_mapping
    type: field_name_mapping
    mapping:
      dst_ip: RemoteIP
      src_ip: LocalIP
    rule_conditions:
      - type: logsource
        category: network_connection
postprocessing:
  # PySigma does not support conversion to ipv4_is_in_any_range
  - type: replace
    pattern: "(RemoteIP|LocalIP) in~ [(]"
    replacement: "ipv4_is_in_any_range(\\1, "
  # Enabling support for ipv4_is_in_range requires a |cidr modifier, that is
  # ill-supported on other pipelines and backends.
  - type: replace
    pattern: "/32"
    replacement: ""
  - type: replace
    pattern: "(RemoteIP|LocalIP) =~ \"(.*?/\\d+)\""
    replacement: "ipv4_is_in_range(\\1, \"\\2\")"
